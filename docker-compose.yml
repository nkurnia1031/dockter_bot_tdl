# Default deployment includes the gateway services and private queue runtime.
services:
  backend:
    image: ${GATEWAY_IMAGE_NAME:-tme3bot-gateway}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
      args:
        TME3BOT_BASE_IMAGE: ${TME3BOT_BASE_IMAGE:-tme3bot-base:py310-tdl0203}
    env_file:
      - ${BACKEND_ENV_FILE:-.env.backend}
    environment:
      DURABLE_DISPATCH_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    volumes:
      - ${GATEWAY_DATA_ROOT:-/srv/tme3bot/gateway}:/data
      - ${UTILITY_WORKSPACE_HOST:-/www/wwwroot/downloads}:${UTILITY_WORKSPACE_ROOT:-/workspace}:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${BACKEND_PORT:-8080}/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - default
      - queue-private

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - queue-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - queue-private

  backend-queue:
    image: ${GATEWAY_IMAGE_NAME:-tme3bot-gateway}:${IMAGE_TAG:-latest}
    env_file:
      - ${BACKEND_ENV_FILE:-.env.backend}
    environment:
      APP_ROLE: backend-queue
      BACKEND_API_URL: http://backend:${BACKEND_PORT:-8080}
      REDIS_URL: redis://redis:6379/0
      BOT_TOKEN: ""
      FRONTEND_SERVICE_TOKEN: ""
      MANAGEMENT_API_TOKEN: ""
      AUTH_JWT_SECRET: ""
      WEB_COOKIE_SECRET: ""
      WORKER_API_TOKEN: ""
      WORKER_API_TOKENS: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - queue-private

  telegram:
    image: ${GATEWAY_IMAGE_NAME:-tme3bot-gateway}:${IMAGE_TAG:-latest}
    env_file:
      - ${TELEGRAM_ENV_FILE:-.env.telegram}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  worker-local:
    image: ${WORKER_IMAGE_NAME:-tme3bot-worker}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      args:
        TME3BOT_BASE_IMAGE: ${TME3BOT_BASE_IMAGE:-tme3bot-base:py310-tdl0203}
    env_file:
      - ${LOCAL_WORKER_ENV_FILE:-.env.worker.local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ${LOCAL_WORKER_DATA_ROOT:-/srv/tme3bot/worker-local}:/data
      - ${UTILITY_WORKSPACE_HOST:-/www/wwwroot/downloads}:${UTILITY_WORKSPACE_ROOT:-/workspace}

volumes:
  queue-redis-data:

networks:
  queue-private:
    internal: true
