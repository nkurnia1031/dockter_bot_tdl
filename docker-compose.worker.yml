services:
  worker:
    image: ${WORKER_IMAGE_NAME:-tme3bot-worker}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      args:
        TME3BOT_BASE_IMAGE: ${TME3BOT_BASE_IMAGE:-tme3bot-base:py310-tdl0203}
    env_file:
      - ${WORKER_ENV_FILE:-.env.worker}
    restart: unless-stopped
    environment:
      DATABASE_ROOT: /database
      TTS_DATA_ROOT: /data/tts
      ARIA2_RPC_URL: http://aria2:6800/jsonrpc
      ARIA2_COOKIE_RELAY_URL: http://aria2:6801
      ARIA2_TOR_PROXY_TOKEN_FILE: /database/aria2-proxy/token
      STORAGE_DB_FILE: /database/storage.db
      TDL_EXPORT_STORAGE: ""
      TDL_DOWNLOAD_STORAGE: ""
    ports:
      # Do not expose the worker API publicly; the reverse proxy owns the domain/TLS.
      - "127.0.0.1:${WORKER_PORT:-8080}:${WORKER_PORT:-8080}"
    volumes:
      - ${PROFILE_ROOT}:/data
      - ${DATABASE_ROOT:-/srv/tme3bot/db/worker}:/database
      - ${UTILITY_WORKSPACE_HOST:-/www/wwwroot/downloads}:${UTILITY_WORKSPACE_ROOT:-/workspace}

  aria2:
    image: ${WORKER_IMAGE_NAME:-tme3bot-worker}:${IMAGE_TAG:-latest}
    command: ["python3", "-m", "tme3bot.worker.aria2_runtime"]
    restart: unless-stopped
    environment:
      ARIA2_STATE_ROOT: /database/aria2
      ARIA2_RPC_URL: http://127.0.0.1:6800/jsonrpc
      ARIA2_COOKIE_RELAY_URL: http://127.0.0.1:6801
      ARIA2_HOOK_PATH: /usr/local/bin/aria2-retry-on-low-speed.py
      ARIA2_TOR_PROXY_TOKEN_FILE: /aria2-proxy/token
      UTILITY_WORKSPACE_ROOT: ${UTILITY_WORKSPACE_ROOT:-/workspace}
    volumes:
      - ${DATABASE_ROOT:-/srv/tme3bot/db/worker}/aria2:/database/aria2
      - ${DATABASE_ROOT:-/srv/tme3bot/db/worker}/aria2-proxy:/aria2-proxy
      - ${UTILITY_WORKSPACE_HOST:-/www/wwwroot/downloads}:${UTILITY_WORKSPACE_ROOT:-/workspace}
    healthcheck:
      test: ["CMD", "python3", "-m", "tme3bot.worker.aria2_runtime", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  tts-1:
    image: ${WORKER_IMAGE_NAME:-tme3bot-worker}:${IMAGE_TAG:-latest}
    command: ["python3", "-m", "tme3bot.worker.tts_helper"]
    restart: unless-stopped
    expose: ["8090", "8118"]
    volumes:
      - ${DATABASE_ROOT:-/srv/tme3bot/db/worker}/aria2-proxy:/aria2-proxy:ro
    environment:
      TTS_TOR_DATA_DIR: /tmp/tor-data
      ARIA2_TOR_PROXY_TOKEN_FILE: /aria2-proxy/token
      HTTP_PROXY: socks5h://127.0.0.1:9050
      HTTPS_PROXY: socks5h://127.0.0.1:9050
      http_proxy: socks5h://127.0.0.1:9050
      https_proxy: socks5h://127.0.0.1:9050
      NO_PROXY: 127.0.0.1,localhost
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/readyz', timeout=2).read()"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  tts-2:
    image: ${WORKER_IMAGE_NAME:-tme3bot-worker}:${IMAGE_TAG:-latest}
    command: ["python3", "-m", "tme3bot.worker.tts_helper"]
    restart: unless-stopped
    expose: ["8090", "8118"]
    volumes:
      - ${DATABASE_ROOT:-/srv/tme3bot/db/worker}/aria2-proxy:/aria2-proxy:ro
    environment:
      TTS_TOR_DATA_DIR: /tmp/tor-data
      ARIA2_TOR_PROXY_TOKEN_FILE: /aria2-proxy/token
      HTTP_PROXY: socks5h://127.0.0.1:9050
      HTTPS_PROXY: socks5h://127.0.0.1:9050
      http_proxy: socks5h://127.0.0.1:9050
      https_proxy: socks5h://127.0.0.1:9050
      NO_PROXY: 127.0.0.1,localhost
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/readyz', timeout=2).read()"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  tts-3:
    image: ${WORKER_IMAGE_NAME:-tme3bot-worker}:${IMAGE_TAG:-latest}
    command: ["python3", "-m", "tme3bot.worker.tts_helper"]
    restart: unless-stopped
    expose: ["8090", "8118"]
    volumes:
      - ${DATABASE_ROOT:-/srv/tme3bot/db/worker}/aria2-proxy:/aria2-proxy:ro
    environment:
      TTS_TOR_DATA_DIR: /tmp/tor-data
      ARIA2_TOR_PROXY_TOKEN_FILE: /aria2-proxy/token
      HTTP_PROXY: socks5h://127.0.0.1:9050
      HTTPS_PROXY: socks5h://127.0.0.1:9050
      http_proxy: socks5h://127.0.0.1:9050
      https_proxy: socks5h://127.0.0.1:9050
      NO_PROXY: 127.0.0.1,localhost
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/readyz', timeout=2).read()"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
