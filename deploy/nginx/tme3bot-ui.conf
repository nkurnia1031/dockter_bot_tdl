# Static dashboard for ui.example.com. Replace the server_name and upstream.
server {
    listen 443 ssl http2;
    server_name ui.example.com;

    root /var/www/tme3bot-ui/current;
    index index.html;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/(?:index\.html|200\.html|build-info\.json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
    }

    location /_app/immutable/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /200.html;
        add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
    }
}
