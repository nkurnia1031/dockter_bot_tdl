name: Publish static web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/test_vue_static_e2e.py'
      - '.github/workflows/web-static.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install and verify
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
      - name: Build static bundle
        working-directory: web
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          printf '{"revision":"%s","built_at":"%s"}\n' "$BUILD_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > static/build-info.json
          pnpm build
      - name: Set up Python for static browser E2E
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install Chromium for static browser E2E
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.64.0"
          python -m playwright install --with-deps chromium
      - name: Verify static bundle with a fake API
        env:
          TME3_RUN_VUE_STATIC_E2E: "1"
        run: python -m unittest tests.test_vue_static_e2e -v
      - name: Package release
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          tar -C web/build -czf "web-dist-${BUILD_SHA}.tar.gz" .
          sha256sum "web-dist-${BUILD_SHA}.tar.gz" > "web-dist-${BUILD_SHA}.tar.gz.sha256"
      - name: Publish rolling release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: web-latest
          name: Static UI latest
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: |
            web-dist-*.tar.gz
            web-dist-*.tar.gz.sha256
