name: Reusable test suite

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-verifier.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Compile Python sources
        run: python -m compileall -q tme3bot utility bot.py run.py

      - name: Run backend tests
        run: python -m unittest discover -s tests -v

  utility-extract-e2e:
    name: Utility archive extraction E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends p7zip-full unar
          command -v 7z
          command -v unar

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run archive extraction end-to-end matrix
        env:
          TME3_RUN_UTILITY_EXTRACT_E2E: "1"
        run: python -m unittest tests.test_utility_extract_e2e -v

  web:
    name: Web checks, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Check Svelte and TypeScript
        working-directory: web
        run: pnpm check

      - name: Run web tests
        working-directory: web
        run: pnpm test

      - name: Build static site
        working-directory: web
        run: pnpm build

      - name: Verify every source route is prerendered
        run: python -m unittest tests.test_web_static_e2e.StaticWebPrerenderArtifactTests -v

  browser-e2e-linux:
    name: Trusted-device browser E2E (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "playwright==1.64.0"
          python -m playwright install --with-deps chromium

      - name: Set up pnpm for static Web browser tests
        uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - name: Set up Node.js for static Web browser tests
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install and build static Web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Run static Web browser E2E
        env:
          TME3_RUN_WEB_STATIC_E2E: "1"
        run: python -m unittest tests.test_web_static_e2e -v

      - name: Run Linux browser E2E
        env:
          TME3_RUN_TRUSTED_DEVICE_BROWSER_E2E: "1"
        run: python -m unittest tests.test_trusted_device_browser_e2e -v

  browser-e2e-windows:
    name: Trusted-device browser E2E (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "playwright==1.64.0"
          python -m playwright install chromium

      - name: Run Windows browser E2E
        env:
          TME3_RUN_TRUSTED_DEVICE_BROWSER_E2E: "1"
        run: python -m unittest tests.test_trusted_device_browser_e2e -v
