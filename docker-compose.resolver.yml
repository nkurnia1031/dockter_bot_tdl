services:
  worker:
    image: ${RESOLVER_IMAGE_NAME:-tme3bot-resolver}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: browser-resolver
      args:
        TME3BOT_BASE_IMAGE: ${TME3BOT_BASE_IMAGE:-tme3bot-base:py310-tdl0203}
    env_file:
      - ${RESOLVER_ENV_FILE:-.env.resolver}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WORKER_PORT:-8080}:${WORKER_PORT:-8080}"
    volumes:
      - ${PROFILE_ROOT:-/srv/tme3bot/resolver}:/data
      - ${UTILITY_WORKSPACE_HOST:-/www/wwwroot/downloads}:${UTILITY_WORKSPACE_ROOT:-/workspace}
