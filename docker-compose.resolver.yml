services:
  resolver-addon:
    image: ${RESOLVER_IMAGE_NAME:-tme3bot-resolver}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: browser-resolver
      args:
        TME3BOT_BASE_IMAGE: ${TME3BOT_BASE_IMAGE:-tme3bot-base:py310-tdl0203}
    command: ["python3", "-m", "tme3bot.worker.resolver_addon"]
    restart: unless-stopped
    expose: ["8091"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
