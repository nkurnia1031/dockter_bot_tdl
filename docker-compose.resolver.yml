services:
  resolver-addon:
    image: ${RESOLVER_IMAGE_NAME:-tme3bot-resolver}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.resolver
      target: resolver
    restart: unless-stopped
    expose: ["8091"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
